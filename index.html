<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#202e53" />
    <script>
      // Apply the saved light/dark choice before the page paints (light is the default).
      // Intro curtain: once per visit, and never for people who turn on "reduce motion".
      try { var h = document.documentElement; if (sessionStorage.getItem('vrlss-intro') || matchMedia('(prefers-reduced-motion: reduce)').matches) h.classList.add('seen'); else { sessionStorage.setItem('vrlss-intro', '1'); h.classList.add('intro') } } catch (e) { document.documentElement.classList.add('seen') }
    </script>
    <style>
      #intro { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; background: #202e53; color: #fff; pointer-events: none; animation: introUp .8s cubic-bezier(.76, 0, .24, 1) 1.05s forwards; }
      #intro div { display: flex; align-items: center; gap: 14px; overflow: hidden; padding: 6px 4px; }
      #intro svg, #intro span { animation: introIn .7s cubic-bezier(.2, .8, .2, 1) .1s both; }
      #intro span { font: 700 clamp(1.6rem, 6vw, 2.4rem)/1 'Bricolage Grotesque', 'Figtree', system-ui, sans-serif; letter-spacing: -.03em; animation-delay: .2s; }
      #intro i { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: #ecaca2; transform-origin: 0 50%; animation: introBar .9s cubic-bezier(.6, 0, .2, 1) .1s both; }
      html.seen #intro { display: none; }
      @keyframes introIn { from { transform: translateY(120%); } }
      @keyframes introBar { from { transform: scaleX(0); } }
      @keyframes introUp { to { transform: translateY(-100%); visibility: hidden; } }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
      />
    </noscript>
    
    <!--app-head-->
  </head>
  <body>
    <div id="intro" aria-hidden="true"><div><svg width="44" height="44" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#2e6e79"/><path d="M15 17h8.6L32 38.4 40.4 17H49L36.6 48H27.4z" fill="#fff"/><circle cx="49" cy="15" r="5" fill="#ECACA2"/></svg><span>VRLS Solutions</span></div><i></i></div>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
