<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1628" />
    <script>
      // Apply the saved light/dark choice before the page paints (light is the default).
      // Intro curtain: once per visit, and never for people who turn on "reduce motion".
      // Cinematic home: first guess of the 3D tier before paint (the page confirms it after load). ?cinema= overrides.
      try { var c = document.documentElement, q = new URLSearchParams(location.search).get('cinema'), rm = matchMedia('(prefers-reduced-motion: reduce)').matches, t = q || (rm ? 'static' : matchMedia('(max-width: 768px), (pointer: coarse)').matches ? 'lite' : 'full'); c.dataset.cm = t; c.dataset.cmCine = t === 'full' || t === 'lite' ? 'on' : 'off'; c.dataset.cmMotion = rm || q === 'static' ? 'off' : 'on' } catch (e) {}
      try { var h = document.documentElement; if (sessionStorage.getItem('vrlss-intro') || matchMedia('(prefers-reduced-motion: reduce)').matches) h.classList.add('seen'); else { sessionStorage.setItem('vrlss-intro', '1'); h.classList.add('intro') } } catch (e) { document.documentElement.classList.add('seen') }
    </script>
    <style>
      /* Headline font. Put WorldOfWater.woff2 (and/or .ttf) in public/fonts/ — until then Comfortaa is used. */
      @font-face { font-family: 'World of Water'; src: local('World of Water'), url('/fonts/WorldOfWater.woff2') format('woff2'), url('/fonts/WorldOfWater.ttf') format('truetype'); font-display: swap; }
      #intro { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; background: #0e1628; pointer-events: none; animation: introUp .75s cubic-bezier(.76, 0, .24, 1) 1.15s forwards; }
      #intro div { display: grid; justify-items: center; gap: 18px; }
      #intro img { width: min(300px, 62vw); height: auto; animation: introIn .8s cubic-bezier(.2, .8, .2, 1) .05s both; }
      #intro i { display: block; width: min(300px, 62vw); height: 3px; background: #2ec4e6; transform-origin: 0 50%; animation: introBar .9s cubic-bezier(.6, 0, .2, 1) .15s both; }
      html.seen #intro { display: none; }
      @keyframes introIn { from { opacity: 0; transform: translateY(18px) scale(.96); filter: blur(6px); } }
      @keyframes introBar { from { transform: scaleX(0); } }
      @keyframes introUp { to { transform: translateY(-100%); visibility: hidden; } }
    </style>
    <link rel="preload" as="image" href="/brand/logo-light.webp" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;600;700&family=Lexend:wght@300;400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Noto+Sans+Telugu:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;600;700&family=Lexend:wght@300;400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Noto+Sans+Telugu:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap"
      />
    </noscript>
    
    <!--app-head-->
  </head>
  <body>
    <div id="intro" aria-hidden="true"><div><img src="/brand/logo-light.webp" alt="" width="300" height="81" /><i></i></div></div>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
